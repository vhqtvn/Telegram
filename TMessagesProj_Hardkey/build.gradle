apply plugin: 'com.android.library'

repositories {
    mavenCentral()
    google()
}

android {
    namespace 'org.telegram.hardkey'
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
    }
}

dependencies {
    // Compile-time only. At runtime these types resolve against the
    // androidx.recyclerview.widget.RecyclerView vendored into TMessagesProj
    // at the same FQCN (the app excludes the maven artifact globally).
    compileOnly 'androidx.recyclerview:recyclerview:1.3.2'
}
